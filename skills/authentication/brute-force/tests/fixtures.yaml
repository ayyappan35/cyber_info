# real security_gateway.threat_router / security_gateway.detection code -
# these are not decorative, they are asserted against.
- name: clean_first_time_login
  evidence:
    username: newuser
    account_exists: true
    failed_attempts: 0
    account_locked: false
    recent_attempt_count_5min: 1
    already_blocked: false
    this_attempt_success: true
    distinct_usernames_from_source_5min: 1
  expected_skill: brute-force
  expected_floor_action: null

- name: below_floor_threshold
