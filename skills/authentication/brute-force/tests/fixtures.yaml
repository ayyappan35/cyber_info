- name: at_floor_threshold
  evidence:
    username: bob
    account_exists: true
    failed_attempts: 20
    account_locked: true
    recent_attempt_count_5min: 20
    already_blocked: false
    this_attempt_success: false
    distinct_usernames_from_source_5min: 1
  expected_skill: brute-force
