skill_id: brute-force
category: authentication
default: true   # fallback when neither credential-stuffing nor account-takeover's routing rule matches

signals:
  - id: failed_attempts
    type: integer
    description: Consecutive failed attempts on this account (webapp_db.py)
  - id: recent_attempt_count_1min
    type: integer
    description: Attempts by this username in the trailing 1 minute (redis_tool) - tightened from a 5-minute/20-attempt window on 2026-09-01, see reason below.
  - id: already_blocked
    type: boolean
  - id: this_attempt_success
    type: boolean

# No routing rule - this skill is the default/fallback for the
# authentication category (see `default: true` above), matched only
# after credential-stuffing and account-takeover's more specific rules
# are checked and don't match.

floor:
  field: recent_attempt_count_1min
  op: gte
  value: 5
  minimum_action: BLOCK
  reason: "5+ attempts against one account in a single minute is unambiguous - never left to model judgment alone. Tightened 2026-09-01 from 20 attempts/5 minutes: that window let an automated brute-force script run for minutes before the deterministic floor caught it: 5 attempts/1 minute catches the same unambiguous pattern much sooner, without narrowing so far that normal human retry behavior (a couple of mistyped passwords) risks tripping it."
