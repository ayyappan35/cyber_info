# Deterministic enforcement layer for security_gateway/gateway.py.
#
# The LLM (Security LLM Discussion node) proposes an action + confidence;
# this file decides what a proposal is actually ALLOWED to do. The LLM
# reasons about context - this file is the only place that says what's
# permitted (CLAUDE.md section 7's SKILL/POLICY/LLM/MCP distinction). The
# LLM can never edit this file, and gateway.py never trusts a proposed
# action without checking it against these rules first.
#
# min_confidence_to_enforce: if the model's own confidence is below this,
# its proposed action is downgraded one step (BLOCK->MITIGATE,
# MITIGATE->ALLOW-with-log) rather than enforced at full strength - an
# uncertain model should not get to fully block a legitimate request.
#
# skills: every skill_id security_gateway/supervisor_agent.py's
# all_skills_for() offers the Security LLM for this request_category
# (its own taxonomy - see that module's _REQUEST_CATEGORY_TAXONOMY) -
# documentation only, never read by policy.py itself. The actions/
# min_confidence_to_enforce below apply to ALL of them uniformly; a
# specific skill can override min_confidence_to_enforce and each
# action's effect/config in its own skills/<category>/<skill_id>/
# response.yaml (security_gateway/policy.py::_skill_response()) - see
# e.g. skills/authentication/credential-stuffing/response.yaml's longer
# block_ttl_seconds than brute-force's category default below.
categories:
  authentication:
    skills: [account-takeover, brute-force, credential-stuffing, password-spraying]
    actions:
      ALLOW:
        enabled: true
      MITIGATE:
        enabled: true
        effect: log_only          # flagged in SIEM, login still proceeds on correct password
      BLOCK:
        enabled: true
        effect: redis_block       # identity added to the Redis/local block list
        block_ttl_seconds: 900
    min_confidence_to_enforce: 0.55

  rag_security:
    skills: [jailbreak, model-extraction, prompt-injection, external-api-abuse, pii-exposure,
             rag-poisoning, retrieval-manipulation]
    actions:
      ALLOW:
        enabled: true
      MITIGATE:
        enabled: true
        effect: sandbox_and_continue   # answer still returned, evidence sandboxed
      BLOCK:
        enabled: true
        effect: refuse_and_sandbox     # fixed refusal message, no context/answer leaves the gateway
    min_confidence_to_enforce: 0.5

  file_security:
    skills: [archive-bomb, malicious-docx, malicious-pdf]
    actions:
      ALLOW:
        enabled: true
      MITIGATE:
        enabled: true
        effect: sandbox_no_ingest      # file held in sandbox, never embedded
      BLOCK:
        enabled: true
        effect: reject_and_sandbox     # HTTP 400 to uploader, evidence sandboxed
    min_confidence_to_enforce: 0.5

  agent_security:
    # intent-drift is offered to the Security LLM same as the other two
    # (all_skills_for() doesn't filter by wiring status) but stays
    # unwired - see skills/agents/intent-drift/SKILL.md for why (needs a
    # goal_alignment_score this build doesn't compute).
    skills: [intent-drift, privilege-escalation, tool-abuse]
    actions:
      ALLOW:
        enabled: true
      MITIGATE:
        enabled: true
        effect: log_only          # flagged in SIEM, but the requested tool is NOT executed -
                                   # unlike authentication's MITIGATE, "never automatically trust
                                   # another agent" (CLAUDE.md 4.5) means an ambiguous A2A message
                                   # doesn't get the benefit of the doubt the way a login attempt does
      BLOCK:
        enabled: true
        effect: refuse_and_sandbox    # message content quarantined as evidence, tool never executes
    min_confidence_to_enforce: 0.55

# Fail-closed default: if the LLM discussion node fails to return a valid,
# schema-conforming decision after retrying (bad JSON, missing field, model
# unreachable), gateway.py falls back to this action per category rather
# than silently defaulting to ALLOW. agent_security defaults to BLOCK
# rather than MITIGATE (unlike the other categories) - "do not
# automatically trust another agent" means a failed discussion should not
# let a tool request through in any form.
fail_closed_action:
  authentication: MITIGATE
  rag_security: MITIGATE
  file_security: MITIGATE
  agent_security: BLOCK
